<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Тест вибрации</title>
<style>
  :root{--bg:#1a0b2e;--card:#2a1748;--gold:#ffc933;--text:#fff;--muted:rgba(255,255,255,.7)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 16px;font-size:14px}
  .info{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .info div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .info b{text-align:right}
  .t{display:block;width:100%;margin:0 0 12px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),#ff8a00);
     color:#1a0b2e;font-size:17px;font-weight:800;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .t small{display:block;font-weight:600;font-size:12px;opacity:.75}
  label.t *{pointer-events:none}
  .sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
  .sw input{transform:scale(1.4)}
  #log{background:#000;border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#9fe39f;min-height:60px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>📳 Тест вибрации</h1>
<p>Нажимайте кнопки по очереди и запомните, на каких телефон вибрировал. Потом сделайте скриншот этой страницы и пришлите его.</p>

<div class="info" id="info"></div>

<button class="t" id="b1">Вибро 0,2 секунды<small>Android</small></button>
<button class="t" id="b2">Вибро-узор «тюф-тюф-тюф»<small>Android</small></button>
<label class="t" id="b3"><input type="checkbox" switch style="display:none">Тик, как на аватарке<small>iPhone (и Android)</small></label>
<div class="sw"><span>Переключатель — потыкайте его<br><small style="color:var(--muted)">iPhone: должен «щёлкать» в руке</small></span><input type="checkbox" switch></div>

<div id="log"></div>

<script>
(function(){
  var ua=navigator.userAgent, log=document.getElementById('log');
  function L(t){ log.textContent=(new Date().toLocaleTimeString())+'  '+t+'\n'+log.textContent }
  var canVibrate=typeof navigator.vibrate==='function';
  var hasSwitch='switch' in HTMLInputElement.prototype;
  var inTikTok=/musical_ly|BytedanceWebview|TikTok|trill/i.test(ua);
  var ios=!/Android/.test(ua)&&(/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1));
  var iosVer=(ua.match(/OS (\d+)_(\d+)/)||[]).slice(1).join('.');
  var andVer=(ua.match(/Android ([\d.]+)/)||[])[1];
  var rows=[
    ['Телефон', ios?('iPhone, iOS '+(iosVer||'?')):(andVer?('Android '+andVer):'компьютер/другое')],
    ['Открыто в', inTikTok?'браузере TikTok':'обычном браузере'],
    ['Вибрация (Android)', canVibrate?'есть ✅':'нет ❌'],
    ['Тик-переключатель (iPhone)', hasSwitch?'есть ✅':'нет ❌']
  ];
  document.getElementById('info').innerHTML=rows.map(function(r){return '<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join('');
  document.getElementById('b1').onclick=function(){ var r=canVibrate?navigator.vibrate(200):'нет функции'; L('вибро 200 мс → '+r) };
  document.getElementById('b2').onclick=function(){ var r=canVibrate?navigator.vibrate([45,95,45,95,45,95,45,95,90]):'нет функции'; L('узор → '+r) };
  document.getElementById('b3').addEventListener('click',function(e){ if(e.target.tagName==='INPUT') return; L('тик-переключатель (тап по метке)'); if(canVibrate) navigator.vibrate(40) });
  document.querySelector('.sw input').addEventListener('change',function(){ L('переключатель → '+(this.checked?'вкл':'выкл')) });
  L('UA: '+ua);
})();
</script>
</body>
</html>
