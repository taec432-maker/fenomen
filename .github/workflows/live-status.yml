# Следит, идёт ли эфир в TikTok (@_heart995), и пишет результат в status.json.
# Один запуск проверяет каждые 2 минуты ~5,5 часа, затем сам себя перезапускает.
# Расписание ниже — запасной вариант: поднимет проверку, если цепочка вдруг прервётся.
name: live-status
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live-status
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - name: Watch TikTok live status
        run: python3 .github/live_watch.py
      - name: Restart watcher
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-status.yml --ref main --repo "$GITHUB_REPOSITORY"
